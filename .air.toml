root = "."
tmp_dir = "bin"

[build]
  args_bin = []
  entrypoint = ["./bin/main"]  # replaces the deprecated build.bin (air >= 1.67)
  cmd = "make templ-notify-proxy && npm run build && go build -tags local -o ./bin/main ./cmd/server/"
  delay = 1000
  exclude_dir = ["tmp", "bin", "node_modules"]
  exclude_file = []
  # tailwind.css is this build's own output — watching it would retrigger air.
  exclude_regex = [".*\\.txt$", "tailwind\\.css$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "html", "css", "templ", "svg", "sql"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
